[project]
name = "datamap-experiments"
version = "0.1.0"
description = "Cross-corpus datamaps via concept erasure / batch integration"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "requests>=2.31",
    "cohere>=5.0",
    "anthropic>=0.40",
    "umap-learn>=0.5.10",
    "toponymy>=0.4",
    "datamapplot>=0.5",
    "scikit-learn>=1.2",
    "harmonypy>=0.0.9",
    "joblib>=1.3",
    "tqdm>=4.60",
    "python-dotenv>=1.0",
    "nest-asyncio>=1.5",
    "mwparserfromhell>=0.7.2",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# nest_asyncio.apply() must run before the Toponymy/config imports.
"pipeline/03_label_topics.py" = ["E402"]
